<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<script>window.SURUM="05.09.2026 22:20";</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spor Günlüğüm">
<meta name="theme-color" content="#2E5BE6">
<meta name="robots" content="noindex">
<title>Spor Günlüğüm</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* ── Tokenlar ─────────────────────────────────────────────── */
  :root{
    --bg:#F2F3F5; --surface:#FFFFFF; --surface2:#F6F7F9;
    --ink:#15171C; --ink2:#5A6070; --ink3:#8A91A3; --line:#E4E6EC;
    --accent:#2E5BE6; --accent-ink:#FFFFFF; --accent-soft:#E9EEFB;
    --amber:#D97A08; --amber-soft:#F9EFDF;
    --green:#1E9E5A; --green-soft:#E2F4EA;
    --danger:#D63838; --danger-soft:#FBE9E9;
    --shadow:0 1px 2px rgba(21,23,28,.05);
    --r-card:16px; --r-btn:13px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    --font-disp:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#101216; --surface:#1C1F26; --surface2:#232732;
      --ink:#EEF0F5; --ink2:#9AA1B2; --ink3:#6B7284; --line:#2B303C;
      --accent:#5B80F2; --accent-ink:#0D1220; --accent-soft:#242E48;
      --amber:#C58122; --amber-soft:#352A15;
      --green:#2FA96C; --green-soft:#17301F;
      --danger:#E25858; --danger-soft:#3A1D1D;
      --shadow:none;
    }
  }
  :root[data-theme="light"]{
    --bg:#F2F3F5; --surface:#FFFFFF; --surface2:#F6F7F9;
    --ink:#15171C; --ink2:#5A6070; --ink3:#8A91A3; --line:#E4E6EC;
    --accent:#2E5BE6; --accent-ink:#FFFFFF; --accent-soft:#E9EEFB;
    --amber:#D97A08; --amber-soft:#F9EFDF;
    --green:#1E9E5A; --green-soft:#E2F4EA;
    --danger:#D63838; --danger-soft:#FBE9E9;
    --shadow:0 1px 2px rgba(21,23,28,.05);
  }
  :root[data-theme="dark"]{
    --bg:#101216; --surface:#1C1F26; --surface2:#232732;
    --ink:#EEF0F5; --ink2:#9AA1B2; --ink3:#6B7284; --line:#2B303C;
    --accent:#5B80F2; --accent-ink:#0D1220; --accent-soft:#242E48;
    --amber:#C58122; --amber-soft:#352A15;
    --green:#2FA96C; --green-soft:#17301F;
    --danger:#E25858; --danger-soft:#3A1D1D;
    --shadow:none;
  }

  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--font); font-size:15px; line-height:1.45;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
  input,select,textarea{font:inherit; color:inherit}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}

  #app{max-width:520px; margin:0 auto; min-height:100dvh;
       padding:0 16px calc(84px + env(safe-area-inset-bottom))}

  .t-title{font-family:var(--font-disp); font-size:26px; font-weight:800; letter-spacing:-.01em; text-wrap:balance}
  .t-num{font-family:var(--font-disp); font-weight:800; font-variant-numeric:tabular-nums}
  .micro{font-size:11px; font-weight:650; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3)}
  .sub{font-size:13px; color:var(--ink2)}

  header.screen-head{
    position:sticky; top:0; z-index:5; margin:0 -16px; padding:14px 16px 10px;
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card);
        box-shadow:var(--shadow); padding:14px}
  .stack{display:flex; flex-direction:column; gap:10px}
  .row{display:flex; align-items:center; gap:10px}
  .grow{flex:1; min-width:0}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px;
       border-radius:var(--r-btn); padding:11px 16px; font-weight:650;
       border:1px solid var(--line); background:var(--surface); transition:transform .08s}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .btn-soft{background:var(--accent-soft); border-color:transparent; color:var(--accent)}
  .btn-danger{background:var(--danger-soft); border-color:transparent; color:var(--danger)}
  .btn-block{width:100%}
  .btn-icon{padding:8px; border-radius:10px; color:var(--ink3); border:none; background:none; line-height:0}
  .btn-icon:active{background:var(--surface2)}
  @media (prefers-reduced-motion: reduce){ .btn:active{transform:none} }

  .pill{display:inline-flex; align-items:center; gap:4px; border-radius:99px;
        padding:2.5px 9px; font-size:11.5px; font-weight:650; letter-spacing:.02em; white-space:nowrap}
  .pill-salon{background:var(--accent-soft); color:var(--accent)}
  .pill-ev{background:var(--amber-soft); color:var(--amber)}
  .pill-kas{background:var(--surface2); color:var(--ink2)}
  .pill-ok{background:var(--green-soft); color:var(--green)}

  .seg{display:flex; background:var(--surface2); border-radius:12px; padding:3px; gap:2px}
  .seg button{flex:1; padding:7px 10px; border-radius:9px; font-size:13.5px; font-weight:600; color:var(--ink2)}
  .seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink);
        box-shadow:0 1px 3px rgba(0,0,0,.12)}

  /* Hafta seçici */
  .weeks{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  .week-chip{background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:10px 6px 8px; text-align:center; transition:transform .08s}
  .week-chip:active{transform:scale(.96)}
  .week-chip .n{font-family:var(--font-disp); font-weight:800; font-size:17px}
  .week-chip .s{font-size:10.5px; color:var(--ink3); font-weight:650}
  .week-chip[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
  .week-chip[aria-pressed="true"] .n{color:var(--accent)}
  .week-chip.tam .s{color:var(--green)}

  /* Gün kartları */
  .day-card{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card);
    padding:14px; box-shadow:var(--shadow); transition:transform .08s}
  .day-card:active{transform:scale(.98)}
  .day-card .dnum{flex:none; width:44px; height:44px; border-radius:13px; display:flex;
    align-items:center; justify-content:center; font-family:var(--font-disp); font-weight:800;
    font-size:17px; background:var(--accent-soft); color:var(--accent)}
  .day-card.tam .dnum{background:var(--green-soft); color:var(--green)}
  .day-card b{display:block; font-size:15.5px}
  .day-card .bar{height:4.5px; background:var(--surface2); border-radius:3px; margin-top:7px; overflow:hidden}
  .day-card .bar i{display:block; height:100%; background:var(--accent); border-radius:3px}
  .day-card.tam .bar i{background:var(--green)}
  .rest-card{display:flex; align-items:center; gap:12px; border:1px dashed var(--line);
    border-radius:var(--r-card); padding:11px 14px; color:var(--ink3)}
  .rest-card .dnum{flex:none; width:44px; text-align:center; font-family:var(--font-disp); font-weight:800; font-size:15px}

  /* Hareket kartı */
  .ex-card{padding:12px}
  .ex-card.done{border-color:color-mix(in srgb, var(--green) 45%, var(--line))}
  .thumb{flex:none; width:74px; height:70px; border-radius:12px; background:var(--surface2);
    padding:0; overflow:hidden; border:none; transition:transform .08s}
  .thumb:active{transform:scale(.94)}
  .ex-card.done .thumb{background:var(--green-soft)}
  .not-line{font-size:12.5px; color:var(--ink2); background:var(--surface2); border-radius:9px;
    padding:6px 10px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}

  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .chip{position:relative; min-width:47px; height:47px; border-radius:12px; padding:0 8px;
    background:var(--surface2); border:1.5px solid transparent; display:inline-flex;
    flex-direction:column; align-items:center; justify-content:center; gap:0;
    font-variant-numeric:tabular-nums; transition:transform .08s}
  .chip:active{transform:scale(.92)}
  .chip .rep{font-family:var(--font-disp); font-weight:800; font-size:14.5px; line-height:1.1}
  .chip .lbl{font-size:9px; font-weight:650; letter-spacing:.05em; text-transform:uppercase; color:var(--ink3)}
  .chip.done{background:var(--green); border-color:var(--green)}
  .chip.done .rep{color:#fff}
  .chip.done .lbl{color:rgba(255,255,255,.75)}
  .chip-add{background:transparent; border:1.5px dashed var(--line); color:var(--ink3)}
  .chip .rm{position:absolute; top:-7px; right:-7px; width:19px; height:19px; border-radius:50%;
    background:var(--ink3); color:var(--bg); font-size:11px; line-height:19px; text-align:center; font-weight:700}
  @media (prefers-reduced-motion: reduce){ .chip:active,.thumb:active,.day-card:active,.week-chip:active{transform:none} }

  .kg-row{background:var(--surface2); border-radius:11px; padding:8px 10px}
  .kg-row input{width:76px; background:var(--surface); border:1px solid var(--line); border-radius:9px;
    padding:8px 10px; font-size:16px; font-weight:700; font-variant-numeric:tabular-nums;
    text-align:center; -moz-appearance:textfield; appearance:textfield}
  .kg-row input::-webkit-outer-spin-button,.kg-row input::-webkit-inner-spin-button{-webkit-appearance:none}
  .kg-row input:focus{border-color:var(--accent); outline:none}
  .kg-row .mem{font-size:12px; color:var(--ink2)}
  .kg-row .mem b{color:var(--ink); font-variant-numeric:tabular-nums}

  .divider{display:flex; align-items:center; gap:10px; margin:6px 2px 0}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--line)}

  /* İstatistik kutuları */
  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .tile{background:var(--surface); border:1px solid var(--line); border-radius:14px;
        padding:12px 10px; text-align:center}
  .tile .v{font-family:var(--font-disp); font-weight:800; font-size:22px;
           font-variant-numeric:tabular-nums; line-height:1.1}
  .tile .l{font-size:11px; font-weight:650; letter-spacing:.06em; text-transform:uppercase;
           color:var(--ink3); margin-top:3px}

  /* İlerleme ızgarası */
  .grid-weeks{display:grid; grid-template-columns:52px repeat(4,1fr); gap:6px; align-items:center}
  .gw-cell{height:38px; border-radius:10px; background:var(--surface2); display:flex;
    align-items:center; justify-content:center; font-size:12px; font-weight:700;
    font-variant-numeric:tabular-nums; color:var(--ink3)}
  .gw-cell.part{background:var(--accent-soft); color:var(--accent)}
  .gw-cell.tam{background:var(--green); color:#fff}
  .gw-lab{font-size:12px; font-weight:650; color:var(--ink2)}

  /* Vücut ölçüleri */
  .m-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:7px}
  .m-tile{background:var(--surface2); border-radius:12px; padding:9px 4px 8px; text-align:center;
    display:flex; flex-direction:column; gap:1px; border:none; transition:transform .08s}
  .m-tile:not(:disabled):active{transform:scale(.94)}
  .m-tile:disabled{opacity:.5}
  .m-tile .l{font-size:9.5px; font-weight:650; letter-spacing:.05em; text-transform:uppercase; color:var(--ink3)}
  .m-tile .v{font-family:var(--font-disp); font-weight:800; font-size:15.5px; font-variant-numeric:tabular-nums}
  .m-tile .v small{font-size:9.5px; font-weight:650; color:var(--ink3)}
  .m-tile .d{font-size:10px; font-weight:650; color:var(--ink2); font-variant-numeric:tabular-nums; min-height:14px}
  .m-form{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .field input[type="date"],.field input[type="number"]{background:var(--surface); border:1px solid var(--line);
    border-radius:11px; padding:11px 12px; font-size:15px; width:100%; appearance:none}
  .field input[type="date"]:focus,.field input[type="number"]:focus{border-color:var(--accent); outline:none}

  .kg-item{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:11px 2px; border-bottom:1px solid var(--line)}
  .kg-item:last-child{border-bottom:none}
  .kg-item .v{font-family:var(--font-disp); font-weight:800; font-size:15px; font-variant-numeric:tabular-nums}
  .kg-item .d{font-size:11px; color:var(--ink3)}

  nav#tabbar{position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:color-mix(in srgb, var(--surface) 88%, transparent);
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  nav#tabbar .inner{max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr)}

  /* Alarm */
  #alarm-overlay{position:fixed; inset:0; z-index:90; display:none; align-items:center; justify-content:center; background:#D63838}
  #alarm-overlay.acik{display:flex; animation:alarmYanip 1.2s steps(2) infinite}
  @keyframes alarmYanip{0%{background:#D63838}50%{background:#1B2A6B}100%{background:#D63838}}
  @media (prefers-reduced-motion: reduce){ #alarm-overlay.acik{animation:none} }
  .alarm-ic{text-align:center; color:#fff; padding:24px; width:100%; max-width:380px; display:flex; flex-direction:column; gap:14px}
  .alarm-ic .buyuk{font-family:var(--font-disp); font-size:60px; font-weight:800; font-variant-numeric:tabular-nums}
  .alarm-ic .soru{font-family:var(--font-disp); font-size:30px; font-weight:800; font-variant-numeric:tabular-nums}
  .alarm-ic input{background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.6); border-radius:14px;
    padding:14px; font-size:26px; font-weight:800; text-align:center; color:#fff; width:100%;
    font-variant-numeric:tabular-nums; -moz-appearance:textfield; appearance:textfield}
  .alarm-ic input::-webkit-outer-spin-button,.alarm-ic input::-webkit-inner-spin-button{-webkit-appearance:none}
  .alarm-ic input::placeholder{color:rgba(255,255,255,.6)}
  .alarm-ic .btn{border:none}
  .al-simdi{font-family:var(--font-disp); font-size:54px; font-weight:800; text-align:center;
    font-variant-numeric:tabular-nums; letter-spacing:.01em}
  .al-saat-input{background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:12px 16px; font-size:30px; font-family:var(--font-disp); font-weight:800; width:100%;
    text-align:center; font-variant-numeric:tabular-nums}
  .al-saat-input:focus{border-color:var(--accent); outline:none}
  nav#tabbar button{display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:6px 4px; color:var(--ink3); font-size:10.5px; font-weight:650;
    letter-spacing:.03em; border-radius:12px}
  nav#tabbar button[aria-current="true"]{color:var(--accent)}

  #overlay,#confirm-overlay{position:fixed; inset:0; z-index:30; background:rgba(10,12,18,.45);
    display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none;
    transition:opacity .18s}
  #overlay.open,#confirm-overlay.open{opacity:1; pointer-events:auto}
  #sheet{width:100%; max-width:520px; max-height:88dvh; overflow-y:auto; overscroll-behavior:contain;
    background:var(--bg); border-radius:20px 20px 0 0; padding:8px 16px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(24px); transition:transform .22s cubic-bezier(.3,1,.4,1)}
  #overlay.open #sheet{transform:none}
  .grabber{width:38px; height:4.5px; border-radius:3px; background:var(--line); margin:4px auto 12px}
  .sheet-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px}
  .sheet-title{font-family:var(--font-disp); font-size:20px; font-weight:800}
  .big-anim{height:190px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r-card); padding:10px; display:flex; justify-content:center}
  .big-anim svg{height:100%; width:auto; max-width:100%}
  @media (prefers-reduced-motion: reduce){ #overlay,#confirm-overlay,#sheet{transition:none} }

  #confirm-overlay{align-items:center; padding:24px}
  #confirm-box{background:var(--surface); border-radius:18px; padding:20px 18px; width:100%;
    max-width:320px; text-align:center; display:flex; flex-direction:column; gap:14px}
  #confirm-box .btns{display:flex; gap:8px}
  #confirm-box .btns .btn{flex:1}

  .field{display:flex; flex-direction:column; gap:6px}
  .field > label{font-size:12.5px; font-weight:650; color:var(--ink2)}
  .field input[type="text"],.field select,.field textarea{background:var(--surface); border:1px solid var(--line);
    border-radius:11px; padding:11px 12px; font-size:15px; width:100%; appearance:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent); outline:none}

  /* Grafik */
  .chart-wrap{position:relative}
  .chart-wrap svg{width:100%; height:auto; display:block; touch-action:manipulation}
  .chart-empty{padding:22px 10px; text-align:center; color:var(--ink2); font-size:13.5px}
  #chart-tip{position:absolute; transform:translate(-50%,-115%); background:var(--ink); color:var(--bg);
    font-size:12px; font-weight:650; font-variant-numeric:tabular-nums; border-radius:8px;
    padding:5px 9px; pointer-events:none; white-space:nowrap; display:none}

  #toast{position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom));
    transform:translate(-50%,12px); z-index:50; background:var(--ink); color:var(--bg);
    padding:10px 18px; border-radius:99px; font-size:13.5px; font-weight:650;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:88vw; text-align:center;
    display:flex; align-items:center; justify-content:center; gap:7px}
  #toast svg{flex:none}
  .tip-ic{flex:none; width:38px; height:38px; border-radius:12px; display:flex;
    align-items:center; justify-content:center}
  #toast.show{opacity:1; transform:translate(-50%,0)}
  #toast.ok{background:var(--green); color:#fff}

  .sec-chip{width:34px; height:34px; border-radius:11px; background:var(--surface2);
    font-family:var(--font-disp); font-weight:800; font-size:14px; color:var(--ink2);
    font-variant-numeric:tabular-nums; transition:transform .08s}
  .sec-chip:active{transform:scale(.9)}
  .sec-chip.on{background:var(--accent); color:var(--accent-ink)}

  .empty{padding:36px 16px; text-align:center; color:var(--ink2)}
  .empty .big{font-family:var(--font-disp); font-size:17px; font-weight:700; color:var(--ink); margin-bottom:6px}
  details.io summary{cursor:pointer; font-weight:650; font-size:13.5px; color:var(--ink2); list-style:none}
  details.io summary::-webkit-details-marker{display:none}

  /* Animasyon figürleri */
  .anim{width:100%; height:100%; display:block}
  .anim .fig{stroke:var(--ink); stroke-width:5; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .anim circle.fig{stroke-width:4}
  .anim .equip{stroke:var(--ink3); stroke-width:3.5; fill:none; stroke-linecap:round; stroke-linejoin:round; opacity:.55}
  .anim .thin{stroke-width:2.5}
  .anim .wt{stroke:var(--accent); stroke-width:5; fill:none; stroke-linecap:round}
  .anim circle.wt{fill:var(--accent); stroke:none}
  .anim .ghost{opacity:.4}

  /* Fotoğraf animasyonları (gerçek çekim, 2 kare) */
  .ph{position:relative; width:100%; height:100%; background:var(--surface2); border-radius:inherit; overflow:hidden}
  .ph img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .big-anim .ph img{object-fit:contain}
  .big-anim .ph{background:transparent}
  .ph img.f2{opacity:0; animation:phswap 2.2s ease-in-out infinite}
  @keyframes phswap{0%,12%{opacity:0} 42%,58%{opacity:1} 88%,100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){ .ph img.f2{animation:none} }

  /* Debug: #anims ızgarası */
  .anim-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding-top:10px}
  .anim-grid .cell{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:6px; text-align:center}
  .anim-grid .cell div{font-size:10px; color:var(--ink2); font-weight:650}
  .anim-grid svg{height:110px}
</style>
</head>
<body>

<div id="app"><main id="screen"></main></div>

function mediaHTML(key){
  const m = (typeof MEDIA !== "undefined") && MEDIA[key];
  if(m) return `<div class="ph"><img src="${m[0]}" alt="" loading="lazy"><img class="f2" src="${m[1]}" alt="" loading="lazy"></div>`;

}
/* Salondaki alet fotoğrafı (Erkan'ın çektiği; media.js'te alet_<itemId> anahtarı) */
const ALET_ALIAS = { d5_4: "d1_3" }; // aynı makine birden çok günde
function aletFoto(itemId){
  if(typeof MEDIA === "undefined") return null;
  const m = MEDIA["alet_" + itemId] || (ALET_ALIAS[itemId] ? MEDIA["alet_" + ALET_ALIAS[itemId]] : null);
  return m ? m[0] : null;
}

/* Kardiyo ve HIIT gün öğeleri + gün içi sıralama: Karın (sabah) → Kardiyo (sabah) → Ağırlık → HIIT */
function kardiyoIT(id){
  return Object.assign(IT(id,
    { name:"Eğimli Yürüyüş", anim:"", sets:["35 dk"], kg:"no", alt:"35 dk · 10 eğim · 3.2 km/sa",
      not:"Sabah aç karnına yap; sabah olmadıysa ağırlık antrenmanının hemen sonrasına koy. Bandı 10 eğime, 3.2 km/sa hıza ayarla." },
    { name:"Eğimli Yürüyüş (evdeki bant)", anim:"", sets:["35 dk"], kg:"no", alt:"35 dk · 10 eğim · 3.2 km/sa",
      not:"Evdeki eğimli koşu bandında: 10 eğim, 3.2 km/sa, 35 dk. Sabah aç karnına ya da antrenman sonunda." }, ""), { tip:"kardiyo" });
}
function hiitIT(id){
  return Object.assign(IT(id,
    { name:"HIIT Bisiklet", anim:"", sets:["10 dk"], kg:"no", alt:"8 tur · 30 sn hızlı / 30 sn yavaş",
      not:"Ağırlık antrenmanının hemen ardından. 1 dk ısınma → 8 tur: 30 sn yüksek dirençte tüm gücünle, 30 sn yavaş (aktif dinlenme) → 1 dk soğuma. Haftada 3 gün yeterli." },
    { name:"HIIT Tempo (bant ya da ip)", anim:"", sets:["10 dk"], kg:"no", alt:"8 tur · 30 sn hızlı / 30 sn yavaş",
      not:"Bisiklet yoksa aynı düzeni bantta tempolu yürüyüş/koşu ya da ip atlamayla uygula. Haftada 3 gün yeterli." }, ""), { tip:"hiit" });
}
function gunSirala(day){
  if(day.items.some(i => i.tip === "kardiyo")) return false;
  const karin = day.items.filter(i => i.karin);
  const agirlik = day.items.filter(i => !i.karin && !i.tip);
  day.items = [...karin, kardiyoIT(day.id + "_k"), ...agirlik];
  if(day.id !== "d2") day.items.push(hiitIT(day.id + "_h"));
  return true;

function dayByIdx(di){ return state.program.days[di]; }
function logKey(w, di){ return "w" + w + "d" + di; }
function getLog(w, di){ return state.log[logKey(w, di)] || null; }
function ensureLog(w, di){
  const k = logKey(w, di);
  if(!state.log[k]) state.log[k] = { mode:"salon", items:{}, ts:Date.now() };
  return state.log[k];
}
function itemLog(log, itemId, mode){
  const k = itemId + "@" + mode;
  if(!log.items[k]) log.items[k] = { t:[], ex:[], kg:null };
  return log.items[k];
}
function variant(item, mode){ return mode === "ev" ? item.ev : item.salon; }

function itemDone(item, log, mode){
  if(!log) return false;
  const il = log.items[item.id + "@" + mode];
  if(!il) return false;
  const v = variant(item, mode);
  return v.sets.length > 0 && v.sets.every((_, i) => il.t[i]);
}
function dayStats(w, di){
  const day = dayByIdx(di);
  const log = getLog(w, di);
  const mode = log ? log.mode : "salon";
  let total = 0, done = 0;
  for(const item of day.items){
    const v = variant(item, mode);
    total += v.sets.length;
    const il = log ? log.items[item.id + "@" + mode] : null;
    if(il){
      done += v.sets.filter((_, i) => il.t[i]).length;
      done += (il.ex || []).filter(e => e.done).length * 0; // ekstralar yüzdeyi bozmasın
    }
  }
  return { total, done, pct: total ? Math.round(done / total * 100) : 0, mode };
}
function weekPct(w){
  const days = state.program.days;
  let t = 0, d = 0;
  days.forEach((_, di) => { const s = dayStats(w, di); t += s.total; d += s.done; });
  return t ? Math.round(d / t * 100) : 0;
}

/* Kilo hafızası: aynı hareket ADI + mod için önceki (hafta, gün) kayıtlarından en yenisi */
function itemName(itemId, mode){
  for(const day of state.program.days)
    for(const it of day.items)
      if(it.id === itemId) return variant(it, mode).name;
  return null;
}
function kgMem(item, mode, w, di){
  const name = variant(item, mode).name;
  let best = null;
  for(const [k, log] of Object.entries(state.log)){
    const m = k.match(/^w(\d+)d(\d+)$/); if(!m) continue;
    const lw = +m[1], ld = +m[2];
    const ord = lw * 10 + ld;
    if(ord >= w * 10 + di) continue;
    for(const [ik, il] of Object.entries(log.items)){
      if(il.kg == null) continue;
      const [iid, imode] = ik.split("@");
      if(imode !== mode) continue;
      if(itemName(iid, imode) !== name) continue;
      if(!best || ord > best.ord) best = { ord, kg: il.kg, w: lw };
    }
  }
  return best;
}
function kgSessions(name, mode){
  const out = [];
  const keys = Object.keys(state.log).map(k => {
    const m = k.match(/^w(\d+)d(\d+)$/);
    return m ? { k, w:+m[1], di:+m[2] } : null;
  }).filter(Boolean).sort((a, b) => (a.w * 10 + a.di) - (b.w * 10 + b.di));
  for(const { k, w, di } of keys){
    const log = state.log[k];
    for(const [ik, il] of Object.entries(log.items)){
      if(il.kg == null) continue;
      const [iid, imode] = ik.split("@");
      if(imode !== mode || itemName(iid, imode) !== name) continue;
      out.push({ lab: "H" + w + "·" + dayByIdx(di).ad.replace(". Gün",""), val: il.kg });
    }
  }
  return out;
}

function wavYap(desen, tekrar){
  // desen: [frekans(Hz, 0=sessiz), süre(sn)] listesi; ham WAV üretip data URI döndürür
  const sr = 22050;
  let tur = 0; for(const [, d] of desen) tur += d;
  const n = Math.floor(sr * tur * tekrar);
  const veri = new Int16Array(n);
  let i = 0;
  for(let t = 0; t < tekrar; t++) for(const [f, d] of desen){
    const adet = Math.floor(sr * d);
    for(let k = 0; k < adet && i < n; k++, i++){
      veri[i] = f ? Math.round(Math.sin(2 * Math.PI * f * (k / sr)) * 30000 *
        Math.min(1, k / 220, (adet - k) / 220)) : 0;
    }
  }
  const bayt = new Uint8Array(44 + veri.length * 2);
  const dv = new DataView(bayt.buffer);
  const yaz = (o, s) => { for(let j = 0; j < s.length; j++) bayt[o + j] = s.charCodeAt(j); };
  yaz(0, "RIFF"); dv.setUint32(4, 36 + veri.length * 2, true); yaz(8, "WAVEfmt ");
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  yaz(36, "data"); dv.setUint32(40, veri.length * 2, true);
  new Uint8Array(bayt.buffer, 44).set(new Uint8Array(veri.buffer));
  let s = "";
  for(let o = 0; o < bayt.length; o += 0x8000)
    s += String.fromCharCode.apply(null, bayt.subarray(o, Math.min(o + 0x8000, bayt.length)));
  return "data:audio/wav;base64," + btoa(s);
}

  try{ alarmSes.volume = 0; await alarmSes.play(); alarmSes.pause(); alarmSes.currentTime = 0; alarmSes.volume = 1; }catch(e){}
  try{ await sessizSes.play(); }catch(e){}
  try{ if(navigator.wakeLock) wl = await navigator.wakeLock.request("screen"); }catch(e){}

document.addEventListener("visibilitychange", async () => {
  if(document.hidden || !state.alarm || !state.alarm.aktif || !alarmInt) return;
  try{ await sessizSes.play(); }catch(e){}
  try{ if(navigator.wakeLock && (!wl || wl.released)) wl = await navigator.wakeLock.request("screen"); }catch(e){}
});

function kardiyoCard(item, w, di, mode){
  const v = variant(item, mode);
  const log = getLog(w, di);
  const il = log ? log.items[item.id + "@" + mode] : null;
  const done = itemDone(item, log, mode);
  const ikon = item.tip === "hiit"
    ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2 4.5 14H10l-1 8 8.5-12H12l1-8Z"/></svg>`
    : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="1.9" fill="currentColor" stroke="none"/><path d="M10.5 22l2-6-2.5-3 1-5 3 2.5 3.5 1M11 8l-3 2.5M13 16l3.5 6"/></svg>`;
  const chips = v.sets.map((rep, i) => {
    const t = il && il.t[i];
    return `<button class="chip ${t ? "done" : ""}" data-action="tick" data-item="${item.id}" data-i="${i}"
      aria-pressed="${!!t}" aria-label="${esc(v.name)}: ${esc(rep)}">
      <span class="rep">${t ? "✓ " : ""}${esc(rep)}</span><span class="lbl">${item.tip === "hiit" ? "hiit" : "kardiyo"}</span></button>`;
  }).join("");
  return `
  <div class="card ex-card stack ${done ? "done" : ""}" style="gap:9px">
    <div class="row">
      <span class="tip-ic" style="background:var(--amber-soft); color:var(--amber)">${ikon}</span>
      <div class="grow">
        <b style="font-size:15px">${esc(v.name)}</b>
        <div class="sub" style="font-size:12.5px; font-variant-numeric:tabular-nums">${esc(v.alt || "")}</div>
        ${done ? `<span class="pill pill-ok" style="margin-top:3px">Tamamlandı ✓</span>` : ""}
      </div>
      <button class="btn-icon" data-action="edit-item" data-item="${item.id}" aria-label="${esc(v.name)} düzenle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg></button>
    </div>
    ${v.not ? `<div class="not-line" style="-webkit-line-clamp:3">${esc(v.not)}</div>` : ""}
    <div class="chips">${chips}</div>
  </div>`;
}

function exCard(item, w, di, mode){
  if(item.tip) return kardiyoCard(item, w, di, mode);
  const v = variant(item, mode);
  const log = getLog(w, di);
  const il = log ? log.items[item.id + "@" + mode] : null;
  const done = itemDone(item, log, mode);
  const mem = kgMem(item, mode, w, di);
  const kgVal = il && il.kg != null ? il.kg : "";
  const chips = v.sets.map((rep, i) => {
    const t = il && il.t[i];
    return `<button class="chip ${t ? "done" : ""}" data-action="tick" data-item="${item.id}" data-i="${i}"
      aria-pressed="${!!t}" aria-label="Set ${i+1}: ${esc(rep)}">
      <span class="rep">${t ? "✓ " : ""}${esc(rep)}</span><span class="lbl">${i + 1}. set</span></button>`;
  }).join("");
  const extra = (il && il.ex || []).map((e, i) =>
    `<button class="chip ${e.done ? "done" : ""}" data-action="tick-ex" data-item="${item.id}" data-i="${i}" aria-pressed="${!!e.done}">
      <span class="rep">${e.done ? "✓ " : ""}${esc(e.lab)}</span><span class="lbl">ekstra</span>
      <span class="rm" data-action="rm-ex" data-item="${item.id}" data-i="${i}" role="button" aria-label="Ekstra seti sil">×</span></button>`).join("");
  const kgHtml = v.kg === "no" ? "" : `
    <div class="row kg-row">
      <input type="number" inputmode="decimal" step="2.5" min="0" value="${kgVal}"
        placeholder="${mem ? mem.kg : "kg"}" data-kg-item="${item.id}" aria-label="${esc(v.name)} kilo">
      <span style="font-size:12px; font-weight:650; color:var(--ink3)">kg${v.kg === "opt" ? " (ops.)" : ""}</span>
      <span class="grow"></span>
      <span class="mem">${mem ? `Geçen: <b>${mem.kg} kg</b> · ${mem.w}. Hafta` : "İlk kayıt"}</span>
    </div>`;
  return `
  <div class="card ex-card stack ${done ? "done" : ""}" style="gap:9px">
    <div class="row">
      <button class="thumb" data-action="open-item" data-item="${item.id}" aria-label="${esc(v.name)} animasyonunu büyüt">${mediaHTML(v.anim)}</button>
      <div class="grow">
        <b style="font-size:15px">${esc(v.name)}</b>
        <div class="sub" style="font-size:12.5px">${v.sets.length} set${item.dinlen ? " · dinlenme " + esc(item.dinlen) : ""}</div>
        ${done ? `<span class="pill pill-ok" style="margin-top:3px">Tamamlandı ✓</span>` : ""}
      </div>
      <button class="btn-icon" data-action="edit-item" data-item="${item.id}" aria-label="${esc(v.name)} düzenle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg></button>
    </div>
    ${v.not ? `<button class="not-line" style="text-align:left; cursor:pointer" data-action="open-item" data-item="${item.id}">${esc(v.not)}</button>` : ""}
    <div class="chips">
      ${chips}${extra}
      <button class="chip chip-add" data-action="add-ex" data-item="${item.id}" aria-label="Ekstra set ekle"><span class="rep">＋</span><span class="lbl">set</span></button>
    </div>
    ${kgHtml}
  </div>`;
}

/* ── İlerleme sekmesi ── */
function renderIlerleme(){
  const days = state.program.days;
  const grid = [`<div class="gw-lab"></div>` + days.map(d =>
      `<div class="gw-lab" style="text-align:center">${esc(d.ad.replace(". Gün", ". G"))}</div>`).join("")];
  for(let w = 1; w <= HAFTA_SAYISI; w++){
    grid.push(`<div class="gw-lab">H${w}</div>` + days.map((_, di) => {
      const s = dayStats(w, di);
      const cls = s.pct === 100 ? "tam" : s.pct > 0 ? "part" : "";
      return `<div class="gw-cell ${cls}">${s.pct === 100 ? "✓" : s.pct > 0 ? "%" + s.pct : "–"}</div>`;
    }).join(""));
  }
  // kilo takibi listesi: kaydı olan hareket adları
  const seen = new Map();
  for(const day of days) for(const it of day.items){
    for(const mode of ["salon", "ev"]){
      const v = variant(it, mode);
      if(v.kg === "no") continue;
      const key = v.name + "@" + mode;
      if(seen.has(key)) continue;
      const ss = kgSessions(v.name, mode);
      if(ss.length) seen.set(key, { name: v.name, mode, ss });
    }
  }

/* ── Grafik (tek seri çizgi) ── */
function chartSVG(ss, unit = "kg"){
  if(ss.length < 2) return `<div class="chart-empty">Grafik için en az iki kilo kaydı gerekli.</div>`;
  const data = ss.slice(-12);
  const Wd = 340, H = 168, L = 40, R = 16, T = 16, B = 24;
  const vals = data.map(d => d.val);
  const mn = Math.min(...vals), mx = Math.max(...vals);
  const pad = Math.max((mx - mn) * .25, mx * .06, 1);
  const y0 = Math.max(0, mn - pad), y1 = mx + pad;
  const X = i => L + (Wd - L - R) * (i / (data.length - 1));
  const Y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  const pts = data.map((d, i) => `${X(i).toFixed(1)},${Y(d.val).toFixed(1)}`);
  const line = "M" + pts.join(" L");
  const area = line + ` L${X(data.length - 1).toFixed(1)},${(H - B).toFixed(1)} L${L},${(H - B).toFixed(1)} Z`;
  const prIdx = vals.lastIndexOf(mx);
  const gridY = [0, .5, 1].map(t => T + (H - T - B) * t);
  const gridV = [y1, (y0 + y1) / 2, y0].map(v => Math.round(v));
  return `
  <svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Kilo gelişim grafiği">
    ${gridY.map((gy, i) => `<line x1="${L}" y1="${gy}" x2="${Wd - R}" y2="${gy}" stroke="var(--line)" stroke-width="1"/>
      <text x="${L - 6}" y="${gy + 3.5}" text-anchor="end" font-size="10" fill="var(--ink3)" style="font-variant-numeric:tabular-nums">${gridV[i]}</text>`).join("")}
    <text x="${L}" y="${H - 6}" font-size="10" fill="var(--ink3)">${esc(data[0].lab)}</text>
    <text x="${Wd - R}" y="${H - 6}" text-anchor="end" font-size="10" fill="var(--ink3)">${esc(data[data.length - 1].lab)}</text>
    <path d="${area}" fill="var(--accent)" opacity="0.09"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${data.map((d, i) => {
      const son = i === data.length - 1, isPr = i === prIdx;
      return `<circle cx="${X(i).toFixed(1)}" cy="${Y(d.val).toFixed(1)}" r="${son ? 5 : 3.5}"
          fill="${isPr ? "var(--green)" : "var(--accent)"}" stroke="var(--surface)" stroke-width="2"/>
        ${son ? `<text x="${X(i).toFixed(1)}" y="${(Y(d.val) - 10).toFixed(1)}" text-anchor="${i > data.length / 2 ? "end" : "middle"}"
          font-size="11.5" font-weight="700" fill="var(--ink)" style="font-variant-numeric:tabular-nums">${d.val}</text>` : ""}
        <circle cx="${X(i).toFixed(1)}" cy="${Y(d.val).toFixed(1)}" r="14" fill="transparent"
          data-action="pt" data-x="${(X(i) / Wd * 100).toFixed(2)}" data-y="${(Y(d.val) / H * 100).toFixed(2)}"
          data-d="${esc(d.lab)}" data-v="${d.val} ${unit}" style="cursor:pointer"/>`;
    }).join("")}
  </svg>`;
}

async function exportData(){
  const d = new Date();
  const dosya = `spor-gunlugu-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}.json`;
  const icerik = JSON.stringify(state, null, 1);
  if(window.claude && window.claude.downloads){
    try{
      await window.claude.downloads.save({ filename: dosya, data: icerik });
      toast("Yedek kaydedildi", "ok", "check");
      return;
    }catch(err){
      if(err && err.code === "declined") return;
      if(err && err.code === "rate_limited"){ toast("Bir kayıt isteği zaten açık — birazdan tekrar dene"); return; }
      // diğer durumlarda klasik indirmeyi dene
    }
  }
  const a = document.createElement("a");
  a.href = "data:application/json;charset=utf-8," + encodeURIComponent(icerik);
  a.download = dosya;
  document.body.appendChild(a); a.click(); a.remove();
  toast("Yedek indirildi");
}
function importData(file){
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const s = JSON.parse(rd.result);
      if(!s || !s.program || !s.log) throw 0;
      confirmDlg("Mevcut veriler bu yedekle değiştirilsin mi?", "Geri Yükle", () => {
        state = s; save(); render(); toast("Yedek geri yüklendi");
      });
    }catch(e){ toast("Dosya okunamadı — geçerli bir yedek değil"); }
  };
  rd.readAsText(file);
}

  const el = e.target.closest("[data-action]");
  if(!el){
    if(e.target.id === "overlay") closeSheet();
    if(e.target.id === "confirm-overlay"){ $("#confirm-overlay").classList.remove("open"); confirmCb = null; }
    return;
  }
  const act = el.dataset.action;
  switch(act){
    case "tab": tab = el.dataset.tab; view = { name:"program" }; render(); break;
    case "hafta": hafta = +el.dataset.w; render(); break;
    case "open-day": view = { name:"day", w: hafta, di: +el.dataset.di }; render(); break;
    case "back": view = { name:"program" }; render(); break;
    case "tip-ok": state.tipOk = true; save(); render(); break;
    case "tip-ev": state.tipEv = true; save(); render(); break;
    case "day-mode": {
      const log = ensureLog(view.w, view.di);
      log.mode = el.dataset.mode; log.ts = Date.now();
      save(); render(); break;
    }
    case "tick": {
      const log = ensureLog(view.w, view.di);
      const il = itemLog(log, el.dataset.item, log.mode);
      const i = +el.dataset.i;
      il.t[i] = !il.t[i];
      log.ts = Date.now(); save();
      const f = findItem(el.dataset.item);
      render();
      if(f && itemDone(f.item, log, log.mode)){
        const s = dayStats(view.w, view.di);
        if(s.pct === 100) toast("Gün tamamlandı!", "ok", "kupa");
        else toast("Hareket tamamlandı", "ok", "check");
      }
      break;
    }
    case "tick-ex": {
      const log = ensureLog(view.w, view.di);
      const il = itemLog(log, el.dataset.item, log.mode);
      il.ex[+el.dataset.i].done = !il.ex[+el.dataset.i].done;
      log.ts = Date.now(); save(); render(); break;
    }
    case "add-ex": {
      const log = ensureLog(view.w, view.di);
      const il = itemLog(log, el.dataset.item, log.mode);
      const f = findItem(el.dataset.item);
      const v = variant(f.item, log.mode);
      const lab = il.ex.length ? il.ex[il.ex.length - 1].lab : (v.sets[v.sets.length - 1] || "10");
      il.ex.push({ lab, done: false });
      log.ts = Date.now(); save(); render(); break;
    }
    case "rm-ex": {
      e.stopPropagation();
      const log = ensureLog(view.w, view.di);
      const il = itemLog(log, el.dataset.item, log.mode);
      il.ex.splice(+el.dataset.i, 1);
      save(); render(); break;
    }
    case "open-item": sheetItem(el.dataset.item); break;
    case "edit-item": sheetEdit(el.dataset.item); break;
    case "save-edit": {
      const f = findItem(el.dataset.item); if(!f) break;
      const mode = el.dataset.mode;
      const v = variant(f.item, mode);
      const name = $("#ed-name").value.trim();
      if(!name){ toast("Harekete bir ad ver"); return; }
      const sets = $("#ed-sets").value.split(",").map(s => s.trim()).filter(Boolean);
      if(!sets.length){ toast("En az bir set gerekli"); return; }
      v.name = name; v.sets = sets; v.not = $("#ed-not").value.trim();
      f.item.dinlen = $("#ed-dinlen").value.trim();
      save(); closeSheet(); render(); toast("Kaydedildi");
      break;
    }
    case "del-item": {
      const f = findItem(el.dataset.item); if(!f) break;
      confirmDlg(`"${variant(f.item, "salon").name}" programdan (tüm haftalardan) çıkarılsın mı?`, "Çıkar", () => {
        state.program.days[f.di].items.splice(f.idx, 1);
        save(); closeSheet(); render();
      });
      break;
    }
    case "add-item": sheetAdd(); break;
    case "save-add": {
      if(view.name !== "day") break;
      const name = $("#ne-name").value.trim();
      if(!name){ toast("Harekete bir ad ver"); $("#ne-name").focus(); return; }
      const evName = $("#ne-evname").value.trim() || name;
      const sets = $("#ne-sets").value.split(",").map(s => s.trim()).filter(Boolean);
      if(!sets.length){ toast("En az bir set gerekli"); return; }
      const anim = $("#ne-anim").value;
      const dinlen = $("#ne-dinlen").value.trim();
      state.program.days[view.di].items.push(
        IT("x" + uid(), {name, anim, sets:[...sets], kg:"yes", not:""},
          {name: evName, anim, sets:[...sets], kg:"opt", not:""}, dinlen));
      save(); closeSheet(); render(); toast(`"${name}" eklendi`);
      break;
    }
    case "add-olcum": sheetOlcum(); break;
    case "save-olcum": {
      const t = $("#ol-t").value || new Date().toISOString().slice(0, 10);
      const rec = { t };
      let dolu = 0;
      for(const [k] of METRIKLER){
        const el2 = $("#ol-" + k);
        if(el2 && el2.value.trim() !== ""){ const v = num(el2.value); if(v != null){ rec[k] = v; dolu++; } }
      }
      if(!dolu){ toast("En az bir ölçü gir"); return; }
      state.olcumler.push(rec);
      state.olcumler.sort((a, b) => a.t < b.t ? -1 : 1);
      save(); closeSheet(); render(); toast("Ölçüm kaydedildi", "ok", "check");
      break;
    }
    case "open-metrik": sheetMetrik(el.dataset.k); break;
    case "del-olcum": {
      const k = el.dataset.k, t = el.dataset.t;
      confirmDlg("Bu ölçüm değeri silinsin mi?", "Sil", () => {
        for(const o of state.olcumler){ if(o.t === t) delete o[k]; }
        state.olcumler = state.olcumler.filter(o => METRIKLER.some(([mk]) => o[mk] != null));
        save(); closeSheet(); render();
      });
      break;
    }
    case "edit-ogun": sheetOgun(+el.dataset.i); break;
    case "sec-ogun": {
      state.beslenme.ogunler[+el.dataset.i].secili = +el.dataset.s;
      save(); render(); break;
    }
    case "save-ogun": {
      const o = state.beslenme.ogunler[+el.dataset.i];
      const ad = $("#og-ad").value.trim();
      const items = $("#og-items").value.split("\n").map(s => s.trim()).filter(Boolean);
      if(!items.length){ toast("En az bir madde gerekli"); return; }
      if(ad) o.ad = ad;
      o.secenekler[o.secili || 0].items = items;
      save(); closeSheet(); render(); toast("Kaydedildi");
      break;
    }
    case "open-kg": sheetKg(el.dataset.name, el.dataset.mode); break;
    case "export": exportData(); break;
    case "reset-all":
      confirmDlg("Tüm tikler ve kilo kayıtları silinecek; program yapısı korunacak. Emin misin?", "Sıfırla", () => {
        state.log = {}; save(); render(); toast("İlerleme sıfırlandı");
      });
      break;
    case "alarm-kur": {
      const saatInp = $("#al-saat");
      if(saatInp && saatInp.value) state.alarm.saat = saatInp.value;
      if(state.alarm.aktif && alarmInt){
        state.alarm.aktif = false; alarmMotoruDurdur(); toast("Alarm kapatıldı");
      } else {
        state.alarm.aktif = true; alarmMotoruBaslat(); toast("Alarm kuruldu — uygulamayı açık bırak", "ok");
      }
      save(); render(); break;
    }
    case "alarm-dene": {
      if(!alarmSes) alarmSes = new Audio(wavYap([[880,.18],[0,.06],[880,.18],[0,.06],[1150,.32],[0,.18]], 4));
      alarmSes.loop = false; alarmSes.volume = 1; alarmSes.currentTime = 0;
      alarmSes.play().then(() => setTimeout(() => { alarmSes.pause(); alarmSes.loop = true; }, 3000)).catch(() => {});
      break;
    }
    case "alarm-coz": {
      const c = parseInt($("#ao-cevap").value, 10);
      if(c === aoCevap){
        alarmSustur();
        alarmHedef = sonrakiZaman(state.alarm.saat);
        toast("Günaydın! Bugünün programı seni bekliyor.", "ok");
        tab = "program"; view = { name:"program" }; render();
      } else {
        $("#ao-cevap").value = "";
        $("#ao-cevap").placeholder = "Yanlış — tekrar dene";
      }
      break;
    }
    case "alarm-snooze": {
      alarmSustur();
      alarmHedef = new Date(Date.now() + 5 * 60000);
      toast("5 dakika ertelendi");
      break;
    }
    case "close-sheet": closeSheet(); break;
    case "confirm-ok": $("#confirm-overlay").classList.remove("open"); if(confirmCb){ const cb = confirmCb; confirmCb = null; cb(); } break;
    case "confirm-cancel": $("#confirm-overlay").classList.remove("open"); confirmCb = null; break;
    case "pt": {
      const tip = $("#chart-tip");
      if(tip){
        tip.textContent = `${el.dataset.d} · ${el.dataset.v}`;
        tip.style.left = el.dataset.x + "%";
        tip.style.top = el.dataset.y + "%";
        tip.style.display = "block";
        clearTimeout(tip._t);
        tip._t = setTimeout(() => tip.style.display = "none", 2600);
      }
      break;
    }
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.kgItem && view.name === "day"){
    const log = ensureLog(view.w, view.di);
    const il = itemLog(log, t.dataset.kgItem, log.mode);
    il.kg = num(t.value);
    log.ts = Date.now(); save();
  }
});
document.addEventListener("change", e => {
  if(e.target.id === "al-saat" && e.target.value){
    state.alarm.saat = e.target.value;
    if(alarmInt) alarmHedef = sonrakiZaman(state.alarm.saat);
    save(); render();
  }
  if((e.target.id === "import-file" || e.target.id === "import-file2") && e.target.files[0]) importData(e.target.files[0]);
});
window.addEventListener("hashchange", render);

render();
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").then(reg => {
    // Uygulama one gelince guncelleme kontrolu (iOS ana ekran uygulamasi arkaplanda uyudugu icin sart)
    document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update(); });
    reg.update();
  });
  // Yeni surum devreye girince sayfayi bir kez otomatik yenile
  const oncekiVardi = !!navigator.serviceWorker.controller;
  let yenilendi = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!oncekiVardi || yenilendi) return;
    yenilendi = true;
    location.reload();
  });
}
</script>
</body>
</html>
